name: Build Meteor 26.1.2

on:
  push:
    branches:
      - meteor-26.1.2
  pull_request:
    branches:
      - meteor-26.1.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: hybridious-26.1.2
          path: build/libs/*.jar
          if-no-files-found: error
